# ============================================================
# WorkLoom CI 质量门禁（审计第 5 轮接入）
# 触发：push / PR to main
# 内容：typecheck + 三包测试（含 DB 集成）+ 全场景套件 + dsh-gate E6
# 注意：DB 集成测试必须真实 PG（RUN_DB_TESTS=1）——0.1.1 前全部 skip 曾掩盖 P0（#22）
# ============================================================
name: ci-gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: workloom
          POSTGRES_DB: workloom
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:workloom@localhost:5432/workloom
      DATABASE_APP_URL: postgres://workloom_app:workloom_dev_app@localhost:5432/workloom
      DATABASE_GATEWAY_URL: postgres://workloom_gateway:workloom_dev_gateway@localhost:5432/workloom
      APP_DB_PASSWORD: workloom_dev_app
      GATEWAY_DB_PASSWORD: workloom_dev_gateway
      JWT_SECRET: ci-gate-secret
      LLM_PROVIDER: mock
      IM_DRIVER: mock
      WORKLOOM_ALLOW_DEMO_AUTH: "1"
      RUN_DB_TESTS: "1"
      TOOL_UNVERIFIED_RATE: "0"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # explicit consumer patches verify immutable baseline Git blobs

      - name: Node 24 + pnpm
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: corepack enable && corepack prepare pnpm@10.14.0 --activate

      - name: 依赖
        run: pnpm install --frozen-lockfile

      - name: typecheck 全包
        run: pnpm -r --if-present typecheck

      - name: 原始来源、逐文件本地适配与离线制品校验
        run: |
          node scripts/verify-local-adaptations.mjs
          node scripts/verify-ui-consumer.mjs --require-governance-state
          node scripts/verify-client-foundation-consumer.mjs
          node --test scripts/ui-offline-mirror.test.mjs scripts/verify-local-adaptations.test.mjs

      - name: 迁移 + 显式隔离演示夹具（正式默认种子保持空白）
        run: |
          cp .env.example .env
          pnpm db:migrate
          pnpm db:seed:demo
          pnpm db:seed:demo # 幂等复跑（L1.4：全部冲突丢弃）

      - name: 哈希链全库验证（#32 口径）
        run: pnpm db:verify-chain

      - name: shared/base/runtime 测试（DB 集成全开）
        run: |
          pnpm -C packages/shared test
          pnpm -C packages/base test
          pnpm -C packages/runtime test

      - name: 正式安装、受控模型与 Agent 回归（不调用供应商）
        run: |
          node --import tsx --test scripts/eagle-production-defaults.test.mjs scripts/seed-production.test.mts scripts/demo-seed-workspace.test.mts scripts/suite-fixture-preflight.test.mjs apps/desktop/electron/credential-store.test.cjs scripts/reset-safety.test.mjs
          node --test scripts/agent-capabilities.test.mjs scripts/agent-client-config.test.mjs bundles/consulting/connectors/deepseek.test.mjs scripts/consulting-eval.test.mjs scripts/portable-runtime-copy.test.mjs apps/desktop/electron/bootstrap.test.cjs
          # C-front legacy suites require a separately supported business adapter;
          # their fixture selector must not accidentally enable them in Eagle.
          env -u RUN_DB_TESTS -u SERVICE_C_TEST_WORKSPACE_ID -u SERVICE_C_WORKSPACE_ID -u RELEASE_WORKSPACE_ID pnpm -C apps/server test --pool=threads --maxWorkers=1
          # Keep database regressions enabled explicitly against the real consulting
          # installation; do not substitute the legacy hotel demo workspace.
          pnpm db:seed
          RELEASE_WORKSPACE_ID=ws-workroom-eagle-production pnpm -C apps/server test --pool=threads --maxWorkers=1 src/service/adapters/business-registry.pg.test.ts src/service/neutral-industry-default.pg.test.ts src/service/overlay-runtime.pg.test.ts src/service/eval-source.pg.test.ts src/service/onboarding-continuity.pg.test.ts src/trpc/fence-proposal.pg.test.ts src/service/onboarding-installation.test.ts src/service/onboarding-model-verification.test.ts
          pnpm -C apps/web test --pool=threads --maxWorkers=1

      - name: 全场景套件（服务层与独立 HTTP 权限矩阵）
        env:
          NODE_ENV: test
        run: pnpm suite

      - name: web 构建
        run: pnpm -C apps/web build

      - name: dsh-gate E6（围栏瀑布 + 事件桥 + H-5 崩溃重放）
        run: bash scripts/dsh-gate.sh
